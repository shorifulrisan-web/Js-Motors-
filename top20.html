<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d35">
<title>JS Motors – Top ২০</title>
<style>
:root{--navy:#101d35;--gold:#d6aa45;--bg:#f3f5f8;--ink:#172033;--muted:#6c7688;--line:#e4e8ef;--green:#16845b;--red:#c44848}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink);padding-bottom:40px}
header{background:linear-gradient(120deg,#101d35,#1b3155);color:#fff;padding:16px 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:12px;color:#d9c18a;font-weight:500;letter-spacing:1px}
a.back{background:var(--gold);color:#201a0b;text-decoration:none;font-weight:700;padding:9px 13px;border-radius:10px;font-size:14px}
.wrap{max-width:1000px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}
button{border:0;border-radius:10px;padding:10px 14px;background:#e7ebf2;color:#243149;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}
button.on{background:var(--navy);color:#fff}
select{padding:10px;border:1px solid #d8dee8;border-radius:9px;background:#fff;font:inherit}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px #17203308}
h2{font-size:18px;margin:0 0 4px}.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.rk{flex:0 0 32px;height:32px;border-radius:50%;background:#edf1f6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.r1{background:#f6d675}.r2{background:#d9dfe8}.r3{background:#e8be9a}
.mid{flex:1;min-width:0}.nm{font-weight:700}.val{text-align:right;font-weight:800;white-space:nowrap}
.g{color:var(--green)}.r{color:var(--red)}
.meter{height:6px;border-radius:4px;background:#edf1f6;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
.sub{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:30px}
</style></head>
<body>
<header><div class="top"><div class="brand">🏆 TOP ২০ <small>JS MOTORS</small></div><a class="back" href="index.html">← ড্যাশবোর্ড</a></div></header>
<div class="wrap">
<nav class="tabs" id="tabs"></nav>
<div class="bar"><div class="note" id="info"></div><select id="per" onchange="draw()"><option value="all">সব সময়</option><option value="m">এই মাস</option><option value="d30">গত ৩০ দিন</option><option value="d7">গত ৭ দিন</option><option value="d1">আজ</option></select></div>
<div class="box" id="body"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+(Math.round((+n||0)*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const pct=(a,b)=>b>0?(Math.round(a/b*1000)/10).toLocaleString('en-IN')+'%':'—';
let db={parts:[],sales:[],purchases:[],cash:[]};
try{const raw=localStorage.getItem('jsmotors_v2');if(raw)db=Object.assign(db,JSON.parse(raw))}catch(_){}
const pm=new Map((db.parts||[]).map(p=>[p.id,p]));
const pn=x=>pm.get(x.pid)?.name||x.name||'?';
const TABS=[
 ['cust','👤 সেরা কাস্টমার'],['prod','📦 বেশি বিক্রির প্রডাক্ট'],['profit','💰 সবচেয়ে লাভের প্রডাক্ট'],['pct','📈 সর্বোচ্চ লাভ %'],
 ['day','📅 সেরা বিক্রির দিন'],['sup','🚚 সেরা সাপ্লায়ার'],['bring','🛒 বেশি কেনা প্রডাক্ট']];
let cur='cust';
function since(){const v=$('per').value,n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(v==='m')return new Date(n.getFullYear(),n.getMonth(),1).getTime();if(v==='d1')return d0;if(v==='d7')return d0-6*864e5;if(v==='d30')return d0-29*864e5;return 0}
function group(list,keyf,init,add){const m=new Map();list.forEach(x=>{const k=keyf(x);let a=m.get(k.id);if(!a){a=init(k);m.set(k.id,a)}add(a,x)});return [...m.values()]}
function prodList(o){return Object.entries(o).sort((a,b)=>b[1].v-a[1].v).map(([k,a])=>esc(k)+' ×'+a.q).join(', ')}
function rows(){
  const f=since(),S=(db.sales||[]).filter(x=>x.ts>=f),P=(db.purchases||[]).filter(x=>x.ts>=f);
  if(cur==='cust'){
    return group(S,x=>{const n=(x.customer||'').trim();return{id:n?n.toLowerCase():(x.cphone?'p:'+x.cphone:'__none__'),name:n||(x.cphone||'নাম দেওয়া হয়নি')}},k=>({name:k.name,v:0,paid:0,due:0,n:0,pr:{}}),(a,x)=>{a.v+=x.total;a.paid+=(x.paid||0)+(x.collected||0);a.due+=x.due>0?x.due:0;a.n++;const p=a.pr[pn(x)]||(a.pr[pn(x)]={q:0,v:0});p.q+=x.qty;p.v+=x.total})
     .sort((a,b)=>b.v-a.v).slice(0,20).map(a=>({name:a.name,val:money(a.v),sub:'কিনেছে: '+prodList(a.pr)+'<br>'+a.n+'টি কেনা · জমা '+money(a.paid)+(a.due>0.004?' · <b class="r">বাকি '+money(a.due)+'</b>':''),n:a.v}));
  }
  const prodAgg=()=>group(S,x=>({id:x.pid,name:pn(x)}),k=>({name:k.name,q:0,v:0,cost:0,g:0}),(a,x)=>{a.q+=x.qty;a.v+=x.total;a.cost+=x.cost;a.g+=x.profit});
  if(cur==='prod')return prodAgg().sort((a,b)=>b.v-a.v).slice(0,20).map(a=>({name:a.name,val:money(a.v),sub:a.q+' পিস বিক্রি · লাভ '+money(a.g),n:a.v}));
  if(cur==='profit')return prodAgg().sort((a,b)=>b.g-a.g).slice(0,20).map(a=>({name:a.name,val:'<span class="'+(a.g>=0?'g':'r')+'">'+money(a.g)+'</span>',sub:a.q+' পিস বিক্রি · লাভ % '+pct(a.g,a.cost),n:Math.max(0,a.g)}));
  if(cur==='pct')return prodAgg().filter(a=>a.cost>0).sort((a,b)=>b.g/b.cost-a.g/a.cost).slice(0,20).map(a=>({name:a.name,val:'<span class="'+(a.g>=0?'g':'r')+'">'+pct(a.g,a.cost)+'</span>',sub:'ক্রয়মূল্য '+money(a.cost)+' → বিক্রয় '+money(a.v)+' · লাভ '+money(a.g),n:Math.max(0,a.g/a.cost)}));
  if(cur==='day')return group(S,x=>{const d=new Date(x.ts),id=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();return{id,t:new Date(d.getFullYear(),d.getMonth(),d.getDate())}},k=>({t:k.t,v:0,g:0,n:0}),(a,x)=>{a.v+=x.total;a.g+=x.profit;a.n++})
     .sort((a,b)=>b.v-a.v).slice(0,20).map(a=>({name:a.t.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'short',year:'numeric'}),val:money(a.v),sub:a.n+'টি বিক্রয় · লাভ '+money(a.g),n:a.v}));
  if(cur==='sup')return group(P,x=>{const n=(x.supplier||'').trim();return{id:n?n.toLowerCase():'__none__',name:n||'সাপ্লায়ারের নাম নেই'}},k=>({name:k.name,v:0,due:0,n:0,pr:{}}),(a,x)=>{a.v+=x.total;a.due+=x.due>0?x.due:0;a.n++;const p=a.pr[pn(x)]||(a.pr[pn(x)]={q:0,v:0});p.q+=x.qty;p.v+=x.total})
     .sort((a,b)=>b.v-a.v).slice(0,20).map(a=>({name:a.name,val:money(a.v),sub:'মাল: '+prodList(a.pr)+'<br>'+a.n+'টি ক্রয়'+(a.due>0.004?' · <b class="r">আমাদের বাকি '+money(a.due)+'</b>':''),n:a.v}));
  if(cur==='bring')return group(P,x=>({id:x.pid,name:pn(x)}),k=>({name:k.name,q:0,v:0,n:0}),(a,x)=>{a.q+=x.qty;a.v+=x.total;a.n++})
     .sort((a,b)=>b.v-a.v).slice(0,20).map(a=>({name:a.name,val:money(a.v),sub:a.q+' পিস কেনা · '+a.n+'বার ক্রয় · গড় '+money(a.q?a.v/a.q:0)+'/পিস',n:a.v}));
  return [];
}
function draw(){
  $('tabs').innerHTML=TABS.map(([k,l])=>'<button class="'+(k===cur?'on':'')+'" onclick="cur=\''+k+'\';draw()">'+l+'</button>').join('');
  const L=rows(),mx=Math.max(...L.map(r=>r.n),0),t=TABS.find(x=>x[0]===cur)[1];
  $('info').textContent=(db.sales||[]).length||(db.purchases||[]).length?'এই ডিভাইসের ডেটা থেকে হিসাব':'';
  $('body').innerHTML='<h2>'+t+' — Top ২০</h2>'+(L.length?L.map((r,i)=>'<div class="item"><div class="rk r'+(i+1)+'">'+(i+1)+'</div><div class="mid"><div class="nm">'+esc(r.name)+'</div><div class="sub">'+r.sub+'</div><div class="meter"><i style="width:'+(mx>0?Math.max(3,Math.round(r.n/mx*100)):0)+'%"></i></div></div><div class="val">'+r.val+'</div></div>').join(''):'<div class="empty">এই সময়ে কোনো তথ্য নেই। বিক্রয়/ক্রয় এন্ট্রি দিলে এখানে আসবে।<br><span class="note">(index.html যে ব্রাউজারে ব্যবহার করেন, এই ফাইলও সেই একই ব্রাউজারে ও একই ফোল্ডার/সাইটে খুলতে হবে)</span></div>');
}
draw();
</script></body></html>
